name: Build and deploy academic site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Compilar documentos LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: documentos/*/main.tex
          work_in_root_file_dir: true

      - name: Copiar PDF al sitio
        shell: bash
        run: |
          mkdir -p public/pdf

          find documentos -mindepth 2 -maxdepth 2 -name main.pdf -print0 |
          while IFS= read -r -d '' archivo; do
            slug="$(basename "$(dirname "$archivo")")"
            cp "$archivo" "public/pdf/${slug}.pdf"
          done

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir Astro
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Cargar sitio construido
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
